[package]
name = "discite"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["image", "file", "svg"] }
fsrs = "6.6.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rand = "0.9"
rfd = "0.17.2"
roxmltree = "0.20"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = "3"

# IA local (llama.cpp embutido). Sem OpenMP: no Windows ele exigiria a
# vcomp140.dll ao lado do executável. GPU: Vulkan no Windows (usa o driver de
# vídeo, nada a instalar) e Metal no Mac com Apple Silicon.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "vulkan"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "metal"] }

[target.'cfg(not(any(windows, all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }

[build-dependencies]
resvg = "0.45.1"
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
