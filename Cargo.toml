[package]
name = "discite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["image", "file", "svg"] }
fsrs = "6.6.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rand = "0.9"
rfd = "0.17.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
resvg = "0.45.1"
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
