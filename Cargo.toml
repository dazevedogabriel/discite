[package]
name = "discite"
version = "0.4.1"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["image", "file", "svg"] }
fsrs = "6.6.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rand = "0.9"
rfd = "0.17.2"
roxmltree = "0.20"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = "3"
# Leva os avisos e erros do llama.cpp para o log de diagnóstico.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# IA local (llama.cpp embutido). Sem OpenMP: no Windows ele exigiria a
# vcomp140.dll ao lado do executável. GPU: Vulkan no Windows e no Linux (usa o
# driver de vídeo, nada a instalar) e Metal no Mac com Apple Silicon.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "vulkan"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "metal"] }

[target.'cfg(not(any(windows, target_os = "linux", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }

[build-dependencies]
resvg = "0.45.1"
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

# O PDF (Typst) sai em milissegundos: essas crates são otimizadas para tamanho.
[profile.release.package.typst]
opt-level = "s"

[profile.release.package.typst-library]
opt-level = "s"

[profile.release.package.typst-layout]
opt-level = "s"

[profile.release.package.typst-eval]
opt-level = "s"

[profile.release.package.typst-realize]
opt-level = "s"

[profile.release.package.typst-pdf]
opt-level = "s"

[profile.release.package.typst-svg]
opt-level = "s"

[profile.release.package.typst-html]
opt-level = "s"

[profile.release.package.typst-syntax]
opt-level = "s"

[profile.release.package.krilla]
opt-level = "s"

[profile.release.package.hayagriva]
opt-level = "s"

[profile.release.package.citationberg]
opt-level = "s"

[profile.release.package.syntect]
opt-level = "s"

[profile.release.package.two-face]
opt-level = "s"

[profile.release.package.wasmi]
opt-level = "s"

[profile.release.package.wasmi_core]
opt-level = "s"

[profile.release.package.wasmi_ir]
opt-level = "s"

[profile.release.package.icu_segmenter]
opt-level = "s"

[profile.release.package.icu_properties]
opt-level = "s"

[profile.release.package.icu_collator]
opt-level = "s"

[profile.release.package.hypher]
opt-level = "s"
