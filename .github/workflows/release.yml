# Publica uma release no GitHub com os pacotes de Windows e macOS.
#
# Para lançar uma versão: ajuste `version` no Cargo.toml, faça o commit e envie
# uma tag com o mesmo número:
#
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in Cargo.toml (expected v${VERSION})."
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            - **Windows:** `Discite-…-windows-x64.zip`. Extract it and run `Discite.exe`.
            - **macOS** (Apple Silicon and Intel, macOS 10.15 or newer): `Discite-…-macos-universal.zip`. Extract it and drag `Discite.app` to Applications.

            ### Opening it on macOS for the first time

            The app is not signed by Apple, so macOS blocks the first launch.

            - macOS 14 or older: right-click **Discite.app** → **Open** → **Open**.
            - macOS 15 or newer: try to open it once, then go to **System Settings → Privacy & Security** → **Open Anyway**.
            - If macOS says the app "is damaged", run this in Terminal and then open it normally:

              ```
              xattr -dr com.apple.quarantine /Applications/Discite.app
              ```
